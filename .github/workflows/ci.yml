name: CI Pipeline

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Build + Test)
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ secrets.SA_PASSWORD || 'TestP@ssw0rd!' }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TestP@ssw0rd!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore MiniLibrary.sln

      - name: Build solution
        run: dotnet build MiniLibrary.sln --no-restore -c Release

      - name: Run unit tests
        run: dotnet test tests/MiniLibrary.UnitTests --no-build -c Release --logger trx --results-directory TestResults/

      - name: Run integration tests
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost;Database=MiniLibraryDb;User Id=sa;Password=TestP@ssw0rd!;TrustServerCertificate=true;"
        run: dotnet test tests/MiniLibrary.IntegrationTests --no-build -c Release --logger trx --results-directory TestResults/

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: TestResults/

  frontend:
    name: Frontend (Build + Lint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check if frontend exists
        id: check_frontend
        run: |
          if [ -f "src/MiniLibrary.Web/package-lock.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check_frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/MiniLibrary.Web/package-lock.json

      - name: Install dependencies
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: src/MiniLibrary.Web
        run: npm ci

      - name: TypeScript type check
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: src/MiniLibrary.Web
        run: npx tsc --noEmit

      - name: Lint
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: src/MiniLibrary.Web
        run: npm run lint

      - name: Build frontend
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: src/MiniLibrary.Web
        run: npm run build
