name: CI Pipeline

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: TestP@ssw0rd!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TestP@ssw0rd!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/MiniLibrary.Web/package-lock.json

      - name: Restore NuGet packages
        run: dotnet restore MiniLibrary.sln

      - name: Build solution
        run: dotnet build MiniLibrary.sln --no-restore -c Release

      - name: Run unit tests
        run: dotnet test tests/MiniLibrary.UnitTests --no-build -c Release --logger trx --results-directory TestResults/

      - name: Run integration tests
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost;Database=MiniLibraryDb;User Id=sa;Password=TestP@ssw0rd!;TrustServerCertificate=true;"
        run: dotnet test tests/MiniLibrary.IntegrationTests --no-build -c Release --logger trx --results-directory TestResults/

      - name: Install frontend dependencies
        working-directory: src/MiniLibrary.Web
        run: npm ci

      - name: Build frontend
        working-directory: src/MiniLibrary.Web
        run: npm run build

      - name: Run frontend tests
        working-directory: src/MiniLibrary.Web
        run: npm test -- --run

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/
