name: Deploy to Azure (Demo)

on:
  workflow_dispatch:
    inputs:
      deploy_api:
        description: 'Deploy API to Container Apps'
        type: boolean
        default: true
      deploy_web:
        description: 'Deploy Frontend to Static Web Apps'
        type: boolean
        default: true

env:
  API_IMAGE: ghcr.io/varojulio/minilibrary-api
  CONTAINER_APP_NAME: minilibrary-api
  RESOURCE_GROUP: minilibrary-demo

jobs:
  build-and-deploy-api:
    if: ${{ inputs.deploy_api }}
    name: Deploy API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          imageToDeploy: ${{ env.API_IMAGE }}:${{ github.sha }}
          environmentVariables: >-
            ASPNETCORE_ENVIRONMENT=Production
            ASPNETCORE_URLS=http://+:5000
            ConnectionStrings__DefaultConnection=secretref:sql-connection-string
            Jwt__Secret=${{ secrets.JWT_SECRET }}
            Jwt__Issuer=MiniLibrary
            Jwt__Audience=MiniLibrary
            Jwt__ExpirationMinutes=60
            Authentication__EnableDevTokens=false
            Authentication__Google__ClientId=${{ vars.GOOGLE_CLIENT_ID }}
            Authentication__Google__ClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }}
            OpenAI__ApiKey=${{ secrets.OPENAI_API_KEY }}
            Email__SmtpHost=smtp.gmail.com
            Email__SmtpPort=587
            Email__UseTls=true
            Email__SenderEmail=${{ vars.EMAIL_SENDER_EMAIL }}
            Email__SenderName=MiniLibrary
            Email__AppPassword=${{ secrets.EMAIL_APP_PASSWORD }}
            App__PublicUrl=${{ vars.AZURE_API_URL }}
            App__FrontendUrl=${{ vars.AZURE_FRONTEND_URL }}

  build-and-deploy-web:
    if: ${{ inputs.deploy_web }}
    name: Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/MiniLibrary.Web/package-lock.json

      - name: Install and build
        working-directory: src/MiniLibrary.Web
        env:
          VITE_API_BASE_URL: ${{ vars.AZURE_API_URL || 'https://minilibrary-api.azurecontainerapps.io' }}/api
        run: |
          npm ci
          npm run build
          cp staticwebapp.config.json dist/

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: src/MiniLibrary.Web/dist
          skip_app_build: true
