name: Deploy to Azure (Demo)

on:
  workflow_dispatch:
    inputs:
      deploy_api:
        description: 'Deploy API to Container Apps'
        type: boolean
        default: true
      deploy_web:
        description: 'Deploy Frontend to Static Web Apps'
        type: boolean
        default: true

env:
  API_IMAGE: ghcr.io/varojulio/minilibrary-api
  CONTAINER_APP_NAME: minilibrary-api
  RESOURCE_GROUP: minilibrary-demo

jobs:
  build-and-deploy-api:
    if: ${{ inputs.deploy_api }}
    name: Deploy API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          imageToDeploy: ${{ env.API_IMAGE }}:${{ github.sha }}

  build-and-deploy-web:
    if: ${{ inputs.deploy_web }}
    name: Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/MiniLibrary.Web/package-lock.json

      - name: Install and build
        working-directory: src/MiniLibrary.Web
        env:
          VITE_API_BASE_URL: ${{ vars.AZURE_API_URL || 'https://minilibrary-api.azurecontainerapps.io' }}/api
        run: |
          npm ci
          npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: src/MiniLibrary.Web
          output_location: dist
          skip_app_build: true
